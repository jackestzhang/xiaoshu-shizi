<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="雨的象形图">
  <defs>
    <linearGradient id="g-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A8BCCE"/><stop offset="100%" stop-color="#6E859B"/></linearGradient>
    <linearGradient id="g-rain" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#63A0C4"/><stop offset="100%" stop-color="#3B6F91"/></linearGradient>
    
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B5636" flood-opacity="0.16"/>
  </filter>

  </defs>

  <g filter="url(#soft)">
    <!-- 云体：横长、上缘平直；左右两端微微下垂，承担“冂”的两边 -->
    <path d="M96,170 H416 A26,26 0 0 1 442,196 V228 A26,26 0 0 1 416,254 H96
             A26,26 0 0 1 70,228 V196 A26,26 0 0 1 96,170 Z" fill="url(#g-cloud)"/>
    <!-- 云朵起伏：只在顶部加圆弧，不打乱上缘那条直线 -->
    <g fill="url(#g-cloud)">
      <circle cx="122" cy="176" r="26"/>
      <circle cx="182" cy="162" r="32"/>
      <circle cx="246" cy="156" r="36"/>
      <circle cx="310" cy="162" r="32"/>
      <circle cx="372" cy="176" r="26"/>
    </g>
    <rect x="78" y="172" width="356" height="8" rx="4" fill="#FFFFFF" opacity="0.28"/>

    <g transform="translate(178,322) scale(1.0)"><path d="M0,-30 C15,-9 17,7 0,18 C-17,7 -15,-9 0,-30 Z" fill="url(#g-rain)"/><circle cx="-5" cy="-3" r="4.4" fill="#FFFFFF" opacity="0.55"/></g><g transform="translate(234,336) scale(0.92)"><path d="M0,-30 C15,-9 17,7 0,18 C-17,7 -15,-9 0,-30 Z" fill="url(#g-rain)"/><circle cx="-5" cy="-3" r="4.4" fill="#FFFFFF" opacity="0.55"/></g><g transform="translate(290,336) scale(0.92)"><path d="M0,-30 C15,-9 17,7 0,18 C-17,7 -15,-9 0,-30 Z" fill="url(#g-rain)"/><circle cx="-5" cy="-3" r="4.4" fill="#FFFFFF" opacity="0.55"/></g><g transform="translate(346,322) scale(1.0)"><path d="M0,-30 C15,-9 17,7 0,18 C-17,7 -15,-9 0,-30 Z" fill="url(#g-rain)"/><circle cx="-5" cy="-3" r="4.4" fill="#FFFFFF" opacity="0.55"/></g>
  </g>
</svg>
