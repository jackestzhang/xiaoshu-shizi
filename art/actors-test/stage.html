<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贴纸舞台 · 动作原型</title>
<style>
:root{--paper:#EFE7D6;--ink:#3E3626;--ochre:#D99A4E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#E7DECB;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;align-items:center;
  background:#FFFDF8;border-bottom:1px solid #E3D8C0}
.bar b{font-size:13px;letter-spacing:.04em;margin-right:6px}
button{font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;
  border:1px solid #DCCDB0;background:#FFF;color:var(--ink);touch-action:manipulation}
button:hover{background:#FBF5E8}
button.primary{background:var(--ochre);border-color:#C7863B;color:#fff;font-weight:600}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
/* 舞台：固定 5:3，里面一切都是绝对定位的贴纸 */
#stage{position:relative;width:100%;height:100%;max-width:1100px;max-height:660px;
  aspect-ratio:5/3;margin:auto;border-radius:16px;overflow:hidden;
  background:linear-gradient(#F7EDD6 0%,#EFE0C2 50%,#E3D8BA 100%);
  box-shadow:0 20px 50px -24px rgba(60,45,25,.45), inset 0 0 0 1px rgba(255,255,255,.5)}
.hills{position:absolute;left:0;top:30%;width:100%;height:22%;display:block;opacity:.62}
.ground{position:absolute;left:0;right:0;top:50%;height:50%;
  background:radial-gradient(120% 70% at 50% 0%,#E2D6B6,#D5C9A8 70%)}

/* 角色：外层管位置，内层管形变，互不干扰 */
.actor{position:absolute;left:0;top:0;will-change:transform}
.actor .body{transform-origin:50% 100%;will-change:transform}
.actor img{display:block;width:100%;height:auto;pointer-events:none;
  /* 可交互提示：贴着轮廓的一圈暖光，慢呼吸。三层 drop-shadow 叠出柔边，
     最后一层仍是原来的落影，别让它丢 */
  animation:halo 3.6s ease-in-out infinite;
  will-change:filter}
@keyframes halo{
  0%,100%{filter:
    drop-shadow(0 0 .4px rgba(255,255,255,.45))
    drop-shadow(0 0 1.6px rgba(255,196,110,.42))
    drop-shadow(0 8px 14px rgba(70,55,35,.20))}
  50%{filter:
    drop-shadow(0 0 1px rgba(255,255,255,1))
    drop-shadow(0 0 3.5px rgba(255,182,74,1))
    drop-shadow(0 8px 14px rgba(70,55,35,.20))}
}
@media (prefers-reduced-motion:reduce){
  .actor img{animation:none;filter:drop-shadow(0 0 6px rgba(255,205,120,.4)) drop-shadow(0 8px 14px rgba(70,55,35,.22))}
}
.shadow{position:absolute;left:0;top:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(80,62,40,.34),rgba(80,62,40,0));
  transform-origin:50% 50%;will-change:transform}
.bubble{position:absolute;z-index:9;max-width:min(46%,340px);background:#FFFDF8;
  border:1px solid #EADFC8;border-radius:16px;padding:9px 14px;font-size:15px;line-height:1.45;
  box-shadow:0 16px 30px -16px rgba(60,45,25,.5);opacity:0;transform:translateY(4px) scale(.96);
  transition:opacity .18s,transform .18s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.bubble b{display:block;font-size:11px;letter-spacing:.1em;color:#6F8F6A;margin-bottom:1px}
.tag{position:absolute;left:14px;top:12px;font-size:11px;letter-spacing:.08em;color:#6B5433;
  background:rgba(255,253,248,.85);border-radius:999px;padding:4px 10px}
</style></head>

<script>
const stage=document.getElementById('stage');
const actor=document.getElementById('farmer');
const body=actor.querySelector('.body');
const shadow=document.getElementById('shadow');
const bubble=document.getElementById('bubble');
const tag=document.getElementById('tag');

let W=0,H=0,groundY=0,actorH=0;
function layout(){
  W=stage.clientWidth; H=stage.clientHeight;
  groundY=H*0.90;                       // 脚踩的位置
  actorH=Math.min(H*0.56,470);
  actor.style.width=actorH*(420/595)+'px';
  actor.style.height=actorH+'px';
  actor.style.left=(W*0.5-actorH*(420/595)/2)+'px';   // 基准：中间
  actor.style.top=(groundY-actorH)+'px';
  shadow.style.width=(actorH*0.42)+'px';
  shadow.style.height=(actorH*0.075)+'px';
  shadow.style.left=(W*0.5-actorH*0.21)+'px';
  shadow.style.top=(groundY-actorH*0.035)+'px';
}
layout(); addEventListener('resize',()=>{actor.getAnimations().forEach(a=>a.cancel());
  body.getAnimations().forEach(a=>a.cancel()); layout();});

const anims=[];
function track(a){anims.push(a);return a;}
function clearAll(){anims.forEach(a=>{try{a.cancel()}catch(e){}});anims.length=0;
  actor.style.transform='';body.style.transform='';shadow.style.transform='';
  body.style.filter='';actor.style.opacity=1;}

const EASE='cubic-bezier(.34,.9,.36,1)';

/* 1. 走：位置平移 + 身体上下颠 + 轻微摇摆（没有关节，只能整体颠） */
async function walk(dx,pct=0){
  const from=pct, to=0;
  track(actor.animate([
    {transform:`translateX(${from}px)`},{transform:`translateX(${to}px)`}
  ],{duration:1400,easing:'ease-in-out',fill:'forwards'}));
  track(body.animate([
    {transform:'translateY(0) rotate(-1.2deg)'},
    {transform:'translateY(-3.5%) rotate(1.2deg)'},
    {transform:'translateY(0) rotate(-1.2deg)'},
    {transform:'translateY(-3.5%) rotate(1.2deg)'},
    {transform:'translateY(0) rotate(-1.2deg)'}
  ],{duration:1400,iterations:1,easing:'ease-in-out',fill:'forwards'}));
  await new Promise(r=>setTimeout(r,1400));
}

/* 2. 举锄：整体放大一点点 + 后仰，再砸下 */
async function lift(){
  track(body.animate([
    {transform:'rotate(0deg) scale(1)'},
    {transform:'rotate(-4deg) scale(1.03)',offset:.45},
    {transform:'rotate(6deg) scale(.985)',offset:.72},
    {transform:'rotate(0deg) scale(1)'}
  ],{duration:1100,easing:EASE,fill:'forwards'}));
  track(shadow.animate([{transform:'scale(1)'},{transform:'scale(.9)',offset:.45},{transform:'scale(1.06)',offset:.72},{transform:'scale(1)'}],
    {duration:1100,easing:EASE}));
  await new Promise(r=>setTimeout(r,1100));
}

/* 3. 跳：预备压扁 → 腾空拉伸 → 落地压扁 */
async function hop(){
  const h=actorH*0.16;
  track(actor.animate([
    {transform:'translateY(0)'},{transform:`translateY(${-h}px)`,offset:.42},
    {transform:'translateY(0)'}
  ],{duration:900,easing:'cubic-bezier(.3,.8,.3,1)',fill:'forwards'}));
  track(body.animate([
    {transform:'scale(1,1)'},{transform:'scale(1.06,.9)',offset:.12},
    {transform:'scale(.96,1.07)',offset:.42},{transform:'scale(1.04,.94)',offset:.78},
    {transform:'scale(1,1)'}
  ],{duration:900,easing:'ease-out',fill:'forwards'}));
  track(shadow.animate([
    {transform:'scale(1)',opacity:.9},{transform:'scale(.62)',opacity:.45,offset:.42},
    {transform:'scale(1.1)',opacity:.95,offset:.8},{transform:'scale(1)',opacity:.9}
  ],{duration:900,easing:'ease-out'}));
  await new Promise(r=>setTimeout(r,900));
}

/* 4. 走远：缩小 + 上移（透视），影子同时变小 */
async function away(){
  track(actor.animate([
    {transform:'translateY(0) scale(1)'},
    {transform:`translateY(${-actorH*0.18}px) scale(.66)`}
  ],{duration:1000,easing:'ease-in-out',fill:'forwards'}));
  track(shadow.animate([{transform:'scale(1)',opacity:.9},{transform:'scale(.66)',opacity:.5}],
    {duration:1000,easing:'ease-in-out',fill:'forwards'}));
  await new Promise(r=>setTimeout(r,1000));
}

/* 5. 傻眼：快速抖动 + 去饱和 */
async function shake(){
  track(body.animate([
    {transform:'rotate(0)'},{transform:'rotate(-3.5deg)',offset:.15},
    {transform:'rotate(3.5deg)',offset:.3},{transform:'rotate(-2.5deg)',offset:.45},
    {transform:'rotate(2.5deg)',offset:.6},{transform:'rotate(-1deg)',offset:.75},
    {transform:'rotate(0)'}
  ],{duration:620,easing:'ease-in-out',fill:'forwards'}));
  track(body.animate([{filter:'saturate(1)'},{filter:'saturate(.55)'},{filter:'saturate(1)'}],
    {duration:620,easing:'ease-in-out'}));
  await new Promise(r=>setTimeout(r,620));
}

function say(who,text,ms=2600){
  bubble.querySelector('b').textContent=who;
  bubble.querySelector('span').textContent=text;
  bubble.classList.add('on');
  // 跟着角色当前的位置放
  const r=actor.getBoundingClientRect(), s=stage.getBoundingClientRect();
  const bw=Math.min(340,stage.clientWidth*0.46);
  let left=r.left-s.left+r.width/2-bw/2;
  left=Math.max(10,Math.min(stage.clientWidth-bw-10,left));
  const top=Math.max(10,r.top-s.top-58);
  bubble.style.width=bw+'px'; bubble.style.left=left+'px'; bubble.style.top=top+'px';
  clearTimeout(say._t); say._t=setTimeout(()=>bubble.classList.remove('on'),ms);
}

const S={};
async function play(){
  clearAll(); bubble.classList.remove('on');
  actor.style.opacity=0; actor.animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'});
  await walk(0,-Math.round(W*0.35));
  tag.textContent='走 = 位移 + 上下颠（没有关节）';
  await lift();
  tag.textContent='举锄 = 整体旋转 4° + 放大 3%';
  say('农夫','咦？草里怎么有个白白的东西。',2200);
  await new Promise(r=>setTimeout(r,1400));
  clearAll();
  await hop();
  tag.textContent='跳 = 位移弧线 + 压扁/拉伸 + 影子收放';
  say('农夫','呀！是只兔子！',2000);
  await new Promise(r=>setTimeout(r,1200));
  await away();
  tag.textContent='走远 = 缩小 + 上移，假装透视';
}

document.querySelector('.bar').addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const a=b.dataset.act;
  if(a==='play'){ play(); return; }
  clearAll(); bubble.classList.remove('on');
  if(a==='walk'){ await walk(0,-Math.round(W*0.35)); tag.textContent='走 = 位移 + 上下颠（没有关节）'; }
  if(a==='lift'){ await lift(); tag.textContent='举锄 = 整体旋转 4° + 放大 3%'; }
  if(a==='hop'){ await hop(); tag.textContent='跳 = 位移弧线 + 压扁/拉伸 + 影子收放'; }
  if(a==='away'){ await away(); tag.textContent='走远 = 缩小 + 上移，假装透视'; }
  if(a==='shake'){ await shake(); tag.textContent='傻眼 = 抖动 + 去饱和，不需要新素材'; }
});

// 进入先演一遍
setTimeout(play,500);
</script>
